              - paragraph [ref=e447]:
                - link "Elizabeth II" [ref=e449] [cursor=pointer]:
                  - /url: /wiki/Elizabeth_II
                - text: (21 April 1926 – 8 September 2022) was
                - link "Queen of the United Kingdom" [ref=e450] [cursor=pointer]:
                  - /url: /wiki/Monarchy_of_the_United_Kingdom
                - text: and other
                - link "Commonwealth realms" [ref=e451] [cursor=pointer]:
                  - /url: /wiki/Commonwealth_realm
                - text: from 6 February 1952 until her death. The first child of the
                - link "Duke and Duchess of York" [ref=e452] [cursor=pointer]:
                  - /url: /wiki/Duke_of_York
                - text: (later
                - link "King George VI" [ref=e453] [cursor=pointer]:
                  - /url: /wiki/George_VI
                - text: and
                - link "Queen Elizabeth" [ref=e454] [cursor=pointer]:
                  - /url: /wiki/Queen_Elizabeth_the_Queen_Mother
                - text: ), she became
                - link "heir presumptive" [ref=e455] [cursor=pointer]:
                  - /url: /wiki/Heir_presumptive
                - text: when the duke became king in 1936 upon
                - link "the abdication" [ref=e456] [cursor=pointer]:
                  - /url: /wiki/Abdication_of_Edward_VIII
                - text: of
                - link "Edward VIII" [ref=e457] [cursor=pointer]:
                  - /url: /wiki/Edward_VIII
                - text: . During the Second World War, she served in the
                - link "Auxiliary Territorial Service" [ref=e458] [cursor=pointer]:
                  - /url: /wiki/Auxiliary_Territorial_Service
                - text: . She married
                - link "Philip Mountbatten" [ref=e459] [cursor=pointer]:
                  - /url: /wiki/Prince_Philip,_Duke_of_Edinburgh
                - text: in 1947; they were wed for 73 years until
                - link "his death" [ref=e460] [cursor=pointer]:
                  - /url: /wiki/Death_and_funeral_of_Prince_Philip,_Duke_of_Edinburgh
                - text: in 2021. She became queen on her father's death in 1952, and reigned for seven decades through dramatic changes in her realms, attaining the oldest age of any British monarch (96), and
                - link "having the longest reign" [ref=e461] [cursor=pointer]:
                  - /url: /wiki/List_of_monarchs_in_Britain_by_length_of_reign
                - text: . She faced media criticism of her family over the breakups of her children's marriages, and after the
                - link "death" [ref=e462] [cursor=pointer]:
                  - /url: /wiki/Death_of_Diana,_Princess_of_Wales
                - text: of
                - link "Diana, Princess of Wales" [ref=e463] [cursor=pointer]:
                  - /url: /wiki/Diana,_Princess_of_Wales
                - text: ", in 1997. However, support for the monarchy in Britain remained high, as did her popularity."
                - link "Elizabeth died" [ref=e464] [cursor=pointer]:
                  - /url: /wiki/Death_and_state_funeral_of_Elizabeth_II
                - text: at
                - link "Balmoral Castle" [ref=e465] [cursor=pointer]:
                  - /url: /wiki/Balmoral_Castle
                - text: and was succeeded by her eldest son,
                - link "Charles III" [ref=e466] [cursor=pointer]:
                  - /url: /wiki/Charles_III
